<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="cms-config-url" type="text/yaml" href="./config.yml">
  <title>The Shillelagh · Pub editor</title>
</head>
<body>
  <script>
    window.CMS_MANUAL_INIT = true;
    // Use the callback registered with DecapBridge for bookmarked directory URLs too.
    if (location.pathname.endsWith('/')) {
      history.replaceState(null, '', 'index.html' + location.search + location.hash);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.18.0/dist/decap-cms.js"
          integrity="sha384-Vu0vdYOBhK+2KywHCtNZ9sCqpzkwx358AT6pCSg8om/clLoDzpWYF41jrtEk/WMM"
          crossorigin="anonymous"></script>
  <script>
    // Existing notices can predate this field. Show the same default as the homepage.
    CMS.registerWidget('homepage-visibility', function HomepageVisibility(props) {
      return h(CMS.getWidget('boolean').control, {
        ...props,
        value: props.value ?? props.field.get('default')
      });
    });
    CMS.init();
  </script>
</body>
</html>
