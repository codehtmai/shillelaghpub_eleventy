backend:
  name: git-gateway
  repo: codehtmai/shillelaghpub_eleventy
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/dad78d69-c1ce-4bf8-8cb8-b48418b89722/pkce
  auth_token_endpoint: /sites/dad78d69-c1ce-4bf8-8cb8-b48418b89722/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://codehtmai.github.io/shillelaghpub_eleventy/
media_folder: src/assets/uploads
public_folder: /assets/uploads
collections:
  - name: club
    label: Pub website
    files:
      - name: settings
        label: Pub information and integrations
        file: src/_data/club.json
        format: json
        fields:
          - { name: name, label: Pub name, widget: string }
          - { name: organization, label: Organization name, widget: string }
          - { name: heroLead, label: Welcome heading first line, widget: string }
          - { name: intro, label: Homepage introduction, widget: text }
          - { name: heroImage, label: Homepage photograph, widget: image }
          - { name: storyTitle, label: Story heading, widget: string }
          - { name: story, label: Pub story, widget: text }
          - { name: calendarId, label: Public Google Calendar ID, widget: string, required: false, hint: "Copy Calendar ID from Settings → Integrate calendar. Enable public event viewing." }
          - { name: calendarZone, label: Calendar time zone, widget: string, hint: "Use a time zone such as America/New_York." }
          - { name: facebookUrl, label: Public Facebook page URL, widget: string, required: false }
          - { name: address, label: Street address for directions and map, widget: string, required: false }
          - { name: hours, label: Pub hours, widget: text, required: false }
          - { name: phone, label: Pub phone number, widget: string, required: false }
          - { name: kitchenHours, label: Kitchen hours, widget: text, required: false }
          - { name: rental, label: Private gatherings, widget: text, required: false }
      - name: pubmenu
        label: Pub menu
        file: src/_data/pubMenu.json
        format: json
        fields:
          - { name: title, label: Menu title, widget: string }
          - { name: edition, label: Menu edition date, widget: string }
          - name: sections
            label: Menu sections
            widget: list
            fields:
              - { name: name, label: Section name, widget: string }
              - name: items
                label: Dishes
                widget: list
                fields:
                  - { name: name, label: Dish name, widget: string }
                  - { name: price, label: Price, widget: string }
                  - { name: description, label: Description and options, widget: text, required: false }
  - name: notices
    label: Pub announcements
    folder: src/news
    create: true
    extension: md
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: date, label: Publication date, widget: datetime }
      - { name: body, label: Notice, widget: markdown }
